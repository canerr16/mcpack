plugins {
    id 'fabric-loom' version '1.8.13'
    id 'java'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    // socket.io-client-java + org.json
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // --- Açık kaynak entegrasyonlar: Litematica / malilib / Baritone ---
    // Bu modlara YALNIZCA reflection (Class.forName) ile bağlanıyoruz; kaynak kodda
    // hiçbir import yok (bkz. worker/LitematicaBridge, BaritoneBridge, AntiCheatTuning).
    // Bu yüzden derleme bağımlılığı DEĞİLLER — runtime'da fabric.mod.json "depends"
    // ile istenir ve kullanıcının mods/ klasöründeki jar'lardan sağlanır. Böylece
    // masa.dev / meteordev maven'ına derleme sırasında bağımlı kalmıyoruz ve
    // sürüm/koordinat sürtünmesi ortadan kalkıyor. litematica_version vb. değerler
    // gradle.properties'te sadece kurulacak jar sürümünü belgelemek için tutuluyor.

    // --- Ağ: socket.io client (Node.js swarm-server ile haberleşme) ---
    // Fabric jar'ının içine gömülür (include -> Jar-in-Jar) ki ayrı kurulum gerekmesin.
    include(implementation("io.socket:socket.io-client:2.1.0"))
    include(implementation("io.socket:engine.io-client:2.1.0"))
    include(implementation("org.json:json:20240303"))
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}
