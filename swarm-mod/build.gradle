plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'java'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    // Litematica + malilib (masa)
    maven { url = 'https://masa.dev/maven' }
    // Baritone (fabric fork — build kaynağına göre AYARLA)
    maven { url = 'https://maven.meteordev.org/releases' }
    maven { url = 'https://maven.meteordev.org/snapshots' }
    // socket.io-client-java + java-websocket
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // --- Açık kaynak entegrasyonlar (doğrudan kullanım) ---
    // Litematica + malilib: şema yükleme/yerleştirme
    modImplementation "fi.dy.masa.malilib:malilib-fabric-${project.minecraft_version}:${project.malilib_version}"
    modImplementation "fi.dy.masa.litematica:litematica-fabric-${project.minecraft_version}:${project.litematica_version}"
    // Baritone: pathfinding + build motoru
    modImplementation "meteordevelopment:baritone:${project.baritone_version}"

    // --- Ağ: socket.io client ---
    // Fabric mod içine gölgelenmesi (shadow) gerekebilir; basitlik için include.
    include(implementation("io.socket:socket.io-client:2.1.0"))
    include(implementation("io.socket:engine.io-client:2.1.0"))
    include(implementation("org.json:json:20240303"))
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}
